<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEMON MATRIX — SIMULACIÓN</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  overflow: hidden;
  background: #000;
  color: #00ff66;
  font-family: monospace;
}

canvas {
  position: fixed;
  inset: 0;
  z-index: -2;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at center, transparent 20%, rgba(0,0,0,.85) 100%),
    linear-gradient(rgba(255,0,0,.04), rgba(0,255,80,.03));
  pointer-events: none;
  z-index: -1;
}

.pantalla {
  width: 100%;
  height: 100vh;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.activa {
  display: flex;
}

.panel {
  width: min(430px, 95vw);
  padding: 30px 22px;
  text-align: center;
  background: rgba(0,0,0,.88);
  border: 1px solid #00ff66;
  border-radius: 18px;
  box-shadow:
    0 0 15px #00ff66,
    0 0 50px rgba(255,0,0,.3);
}

.demonio {
  font-size: 70px;
  filter: drop-shadow(0 0 15px red);
}
